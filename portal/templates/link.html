{% extends "base.html" %}
{% block title %}Link a launcher{% endblock %}
{% block content %}
<h1>Link a launcher</h1>
<p>Enter the code your MAG launcher shows.</p>
{% if let Some(e) = error %}<p class="alert">{{ e }}</p>{% endif %}
<form method="post" action="/link" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Code
    <input name="code" value="{{ code }}" placeholder="BCDF-GHJK" maxlength="16" autocomplete="off" autocapitalize="characters" required autofocus></label>
  <button>Continue</button>
</form>
{% endblock %}
