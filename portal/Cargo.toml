[package]
name = "mag-portal"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Player accounts portal: Google sign-in, launcher linking and signed game tickets"
publish = false

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["form"] }
base64 = "0.23.1"
hmac = "0.13.0"
flate2 = "1.1.11"
clap = { version = "4.6.9", features = ["derive", "env"] }
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "pem"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rusty-s3 = { version = "0.12.0", default-features = false, features = ["rustcrypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "time"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Signature checks in tests run thousands of P-256 operations.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
rsa = "0.10"
