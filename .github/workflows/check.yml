name: Public source checks
# Pull requests check PR branches. main is checked by main-images.yml and
# release tags by release-please.yml, both through workflow_call, so a push
# trigger here would only run the same checks twice.
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or release tag to check
        type: string
        required: false
      chart_only:
        description: Check only the Helm chart for a chart component release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  boundary:
    if: inputs.chart_only != true
    runs-on: mag-recomp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/self-hosted-linux
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Prepare Python checks
        run: |
          python3 -m venv "$RUNNER_TEMP/check-venv"
          "$RUNNER_TEMP/check-venv/bin/python" -m pip install PyYAML==6.0.3
      - run: '"$RUNNER_TEMP/check-venv/bin/python" -m unittest discover -s tests -v'
      - run: python3 tools/check_public_tree.py
  gameplay:
    if: inputs.chart_only != true
    runs-on: mag-recomp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/self-hosted-linux
        with:
          rust: 'true'
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.99.0 fmt --manifest-path gameplay/Cargo.toml --all -- --check
      - run: cargo +1.99.0 clippy --locked --manifest-path gameplay/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.99.0 test --locked --manifest-path gameplay/Cargo.toml
      - run: cargo +1.99.0 build --locked --manifest-path gameplay/Cargo.toml --bins --examples
  horizon:
    if: inputs.chart_only != true
    runs-on: mag-recomp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: docker build --target check horizon
      - name: Check configured worlds against independent Rust workers
        run: docker build --target check --file tests/Dockerfile.world-registry .
  portal:
    if: inputs.chart_only != true
    runs-on: mag-recomp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # Natively, with the dependency build cached between runs: the Docker check stage compiled
      # every dependency three times from scratch and exported a multi-GB image nothing used.
      - uses: ./.github/actions/self-hosted-linux
        with:
          rust: 'true'
          packages: postgresql
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: portal -> target
      - name: Start a throwaway PostgreSQL
        run: |
          pg="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n1)"
          data="$RUNNER_TEMP/portal-pg"
          start="'$pg/initdb' -D '$data' -U portal --auth=trust >/dev/null && '$pg/pg_ctl' -D '$data' -w -l '$RUNNER_TEMP/portal-pg.log' -o '-k $RUNNER_TEMP -c listen_addresses=127.0.0.1 -p 55432' start"
          if [ "$(id -u)" = 0 ]; then
            # initdb refuses to run as root.
            mkdir -p "$data" && chown postgres "$data" "$RUNNER_TEMP" && su postgres -c "$start"
          else
            sh -c "$start"
          fi
          echo "DATABASE_URL=postgres://portal@127.0.0.1:55432/postgres" >> "$GITHUB_ENV"
      - run: cargo +1.99.0 fmt --manifest-path portal/Cargo.toml --all -- --check
      - run: cargo +1.99.0 clippy --locked --manifest-path portal/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.99.0 test --locked --manifest-path portal/Cargo.toml
  chart:
    runs-on: mag-recomp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/self-hosted-linux
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Lint, render and package the chart with synthetic CI values
        run: |
          helm lint --strict charts/mag-recomp-server -f charts/mag-recomp-server/ci-values.yaml
          helm template ci charts/mag-recomp-server -f charts/mag-recomp-server/ci-values.yaml > "$RUNNER_TEMP/mag-chart-rendered.yaml"
          helm package charts/mag-recomp-server --destination "$RUNNER_TEMP"
      - name: Check rendered deployment contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/chart-venv"
          "$RUNNER_TEMP/chart-venv/bin/python" -m pip install PyYAML==6.0.3
          "$RUNNER_TEMP/chart-venv/bin/python" -m unittest discover -s tests -p test_helm_chart.py -v
          "$RUNNER_TEMP/chart-venv/bin/python" -m unittest discover -s tests -p test_data_bundle.py -v
      - run: python3 tools/check_public_tree.py
  release-routing:
    runs-on: mag-recomp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the Release Please version bundled by the pinned action
        run: npm install --prefix "$RUNNER_TEMP/release-routing" --ignore-scripts --no-audit --no-fund release-please@17.6.0
      - name: Check real component routing and publication contracts offline
        run: NODE_PATH="$RUNNER_TEMP/release-routing/node_modules" node tests/release-routing.cjs
      - name: Check PR title validation and event handling
        run: NODE_PATH="$RUNNER_TEMP/release-routing/node_modules" node --test tests/pr-title.cjs
