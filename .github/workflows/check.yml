name: Public source checks
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or release tag to check
        type: string
        required: false
      chart_only:
        description: Check only the Helm chart for a chart component release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  boundary:
    if: inputs.chart_only != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Prepare Python checks
        run: |
          python3 -m venv "$RUNNER_TEMP/check-venv"
          "$RUNNER_TEMP/check-venv/bin/python" -m pip install PyYAML==6.0.3
      - run: '"$RUNNER_TEMP/check-venv/bin/python" -m unittest discover -s tests -v'
      - run: python3 tools/check_public_tree.py
  gameplay:
    if: inputs.chart_only != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.99.0 fmt --manifest-path gameplay/Cargo.toml --all -- --check
      - run: cargo +1.99.0 clippy --locked --manifest-path gameplay/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.99.0 test --locked --manifest-path gameplay/Cargo.toml
      - run: cargo +1.99.0 build --locked --manifest-path gameplay/Cargo.toml --bins --examples
  horizon:
    if: inputs.chart_only != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: docker build --target check horizon
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Lint, render and package the chart with synthetic CI values
        run: |
          helm lint --strict charts/mag-recomp-server -f charts/mag-recomp-server/ci-values.yaml
          helm template ci charts/mag-recomp-server -f charts/mag-recomp-server/ci-values.yaml > "$RUNNER_TEMP/mag-chart-rendered.yaml"
          helm package charts/mag-recomp-server --destination "$RUNNER_TEMP"
      - name: Check rendered deployment contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/chart-venv"
          "$RUNNER_TEMP/chart-venv/bin/python" -m pip install PyYAML==6.0.3
          "$RUNNER_TEMP/chart-venv/bin/python" -m unittest discover -s tests -p test_helm_chart.py -v
          "$RUNNER_TEMP/chart-venv/bin/python" -m unittest discover -s tests -p test_data_bundle.py -v
      - run: python3 tools/check_public_tree.py
