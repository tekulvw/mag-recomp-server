name: Public source checks
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or release tag to check
        type: string
        required: false
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/check_public_tree.py
  gameplay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.99.0 fmt --manifest-path gameplay/Cargo.toml --all -- --check
      - run: cargo +1.99.0 clippy --locked --manifest-path gameplay/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.99.0 test --locked --manifest-path gameplay/Cargo.toml
      - run: cargo +1.99.0 build --locked --manifest-path gameplay/Cargo.toml --bins --examples
  horizon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: docker build --target check horizon
