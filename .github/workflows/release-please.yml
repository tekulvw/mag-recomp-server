name: Release Please, container images and Helm chart

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A dispatch also targets main. Serialize PR/release creation and publication.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      medius_release_created: ${{ steps.release.outputs['horizon--release_created'] }}
      medius_tag_name: ${{ steps.release.outputs['horizon--tag_name'] }}
      medius_version: ${{ steps.release.outputs['horizon--version'] }}
      gameplay_release_created: ${{ steps.release.outputs['gameplay--release_created'] }}
      gameplay_tag_name: ${{ steps.release.outputs['gameplay--tag_name'] }}
      gameplay_version: ${{ steps.release.outputs['gameplay--version'] }}
      chart_release_created: ${{ steps.release.outputs['charts/mag-recomp-server--release_created'] }}
      chart_tag_name: ${{ steps.release.outputs['charts/mag-recomp-server--tag_name'] }}
      chart_version: ${{ steps.release.outputs['charts/mag-recomp-server--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  application-release-checks:
    needs: release-please
    if: needs.release-please.outputs.medius_release_created == 'true' || needs.release-please.outputs.gameplay_release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.release-please.outputs.medius_tag_name || needs.release-please.outputs.gameplay_tag_name }}

  chart-release-checks:
    needs: release-please
    if: needs.release-please.outputs.chart_release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.release-please.outputs.chart_tag_name }}
      chart_only: true

  # Publish in this run: GITHUB_TOKEN-created releases do not start tag workflows.
  publish-medius:
    needs: [release-please, application-release-checks]
    if: needs.release-please.outputs.medius_release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image_suffix: medius
      context: horizon
      ref: ${{ needs.release-please.outputs.medius_tag_name }}
      version: ${{ needs.release-please.outputs.medius_version }}

  publish-gameplay:
    needs: [release-please, application-release-checks]
    if: needs.release-please.outputs.gameplay_release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image_suffix: game
      context: gameplay
      ref: ${{ needs.release-please.outputs.gameplay_tag_name }}
      version: ${{ needs.release-please.outputs.gameplay_version }}

  publish-chart:
    needs: [release-please, chart-release-checks]
    if: needs.release-please.outputs.chart_release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the chart release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.chart_tag_name }}
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Package the chart and verify its release version
        env:
          CHART_VERSION: ${{ needs.release-please.outputs.chart_version }}
          CHART_TAG: ${{ needs.release-please.outputs.chart_tag_name }}
        run: |
          test "$CHART_TAG" = "chart-v$CHART_VERSION"
          mkdir -p "$RUNNER_TEMP/chart-package"
          helm package charts/mag-recomp-server --destination "$RUNNER_TEMP/chart-package"
          test -f "$RUNNER_TEMP/chart-package/mag-recomp-server-$CHART_VERSION.tgz"
      - name: Log in and publish the OCI chart
        env:
          GHCR_TOKEN: ${{ github.token }}
          CHART_VERSION: ${{ needs.release-please.outputs.chart_version }}
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart-package/mag-recomp-server-$CHART_VERSION.tgz" "oci://ghcr.io/$owner/charts"
      - name: Remove registry credentials
        if: always()
        env:
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
        run: rm -f "$HELM_REGISTRY_CONFIG"
