name: Release Please, container images and Helm chart

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A dispatch also targets main. Serialize PR/release creation and publication.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      chart_release_created: ${{ steps.release.outputs['charts/mag-recomp-server--release_created'] }}
      chart_tag_name: ${{ steps.release.outputs['charts/mag-recomp-server--tag_name'] }}
      chart_version: ${{ steps.release.outputs['charts/mag-recomp-server--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-checks:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}

  chart-release-checks:
    needs: release-please
    if: needs.release-please.outputs.chart_release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.release-please.outputs.chart_tag_name }}
      chart_only: true

  # GITHUB_TOKEN releases do not trigger another release/tag workflow. Publish
  # here, after checking the tagged source, only when Release Please releases it.
  publish-images:
    needs: [release-please, release-checks]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: medius
            context: horizon
          - image: game
            context: gameplay
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Resolve image name and source revision
        id: source
        env:
          IMAGE_SUFFIX: ${{ matrix.image }}
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/mag-recomp-server-$IMAGE_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Container tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.source.outputs.image }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-chart:
    needs: [release-please, chart-release-checks]
    if: needs.release-please.outputs.chart_release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the chart release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.chart_tag_name }}
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Package the chart and verify its release version
        env:
          CHART_VERSION: ${{ needs.release-please.outputs.chart_version }}
          CHART_TAG: ${{ needs.release-please.outputs.chart_tag_name }}
        run: |
          test "$CHART_TAG" = "chart-v$CHART_VERSION"
          mkdir -p "$RUNNER_TEMP/chart-package"
          helm package charts/mag-recomp-server --destination "$RUNNER_TEMP/chart-package"
          test -f "$RUNNER_TEMP/chart-package/mag-recomp-server-$CHART_VERSION.tgz"
      - name: Log in and publish the OCI chart
        env:
          GHCR_TOKEN: ${{ github.token }}
          CHART_VERSION: ${{ needs.release-please.outputs.chart_version }}
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart-package/mag-recomp-server-$CHART_VERSION.tgz" "oci://ghcr.io/$owner/charts"
      - name: Remove registry credentials
        if: always()
        env:
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
        run: rm -f "$HELM_REGISTRY_CONFIG"
