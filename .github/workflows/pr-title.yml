name: PR title

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: mag-recomp-server
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the parser version used by Release Please
        run: npm install --prefix "$RUNNER_TEMP/pr-title" --ignore-scripts --no-audit --no-fund release-please@17.6.0
      - name: Validate the title from the pull request event
        run: NODE_PATH="$RUNNER_TEMP/pr-title/node_modules" node tools/check-pr-title.cjs
