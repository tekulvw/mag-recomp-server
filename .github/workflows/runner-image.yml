name: Runner image

# Builds ghcr.io/OWNER/mag-recomp-server-runner from images/runner. The
# mag-recomp-server runner scale set pins the digest this reports; pin it there
# to roll a new image out. Workflows never pull this image themselves.
# Pull requests that change the image only build it; main publishes it.
on:
  pull_request:
    paths:
      - images/runner/**
      - .github/workflows/runner-image.yml
  push:
    branches: [main]
    paths:
      - images/runner/**
      - .github/workflows/runner-image.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('runner-image-pr-{0}', github.event.pull_request.number)
    || format('runner-image-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: mag-recomp-server
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runner image without publishing it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/runner
          platforms: linux/amd64
          outputs: type=cacheonly

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: mag-recomp-server
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the image name and tag
        id: source
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          # The actions/runner version of the base image, then this workflow's run number.
          # The base tag is <runner version>-<build>; keep only the runner version.
          base="$(sed -n 's/^ARG BASE_IMAGE=[^:]*:\([^@]*\)@.*/\1/p' images/runner/Dockerfile)"
          runner="${base%%-*}"
          test -n "$runner"
          echo "image=ghcr.io/$owner/mag-recomp-server-runner" >> "$GITHUB_OUTPUT"
          echo "tag=$runner-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish the runner image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/runner
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.source.outputs.image }}:${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Report the digest to pin
        env:
          REF: ${{ steps.source.outputs.image }}:${{ steps.source.outputs.tag }}@${{ steps.build.outputs.digest }}
        run: echo "$REF" | tee -a "$GITHUB_STEP_SUMMARY"
