[package]
name = "mag-gameplay"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
publish = false
default-run = "mag-gameplay"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[[bin]]
name = "mag-navmesh"
path = "src/navmesh_cli.rs"
