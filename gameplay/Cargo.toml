[package]
name = "mag-gameplay"
version = "0.14.4"
edition = "2024"
rust-version = "1.99"
publish = false
default-run = "mag-gameplay"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["float_roundtrip", "raw_value"] }
sha2 = "=0.10.9"
mag-navmesh-sys = { path = "navmesh-sys" }

[[bin]]
name = "mag-navmesh"
path = "src/navmesh_cli.rs"
