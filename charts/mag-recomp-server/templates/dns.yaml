{{- if .Values.dns.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mag.name" . }}-dns
  labels: {{ include "mag.labels" . | nindent 4 }}
data:
  Corefile: |
    .:1053 {
      errors
      header {
        response clear aa
        response set ra
      }
      health :8080
      ready :8181
      hosts /dev/null {
        {{- range .Values.dns.hostnames }}
        {{ $.Values.dns.answerIPv4 }} {{ . }}
        {{- end }}
        ttl 60
        no_reverse
        fallthrough
      }
      forward . {{ join " " .Values.dns.upstreams }}
      loop
      reload
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mag.name" . }}-dns
  labels: {{ include "mag.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dns
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dns
      annotations:
        checksum/dns: {{ toJson .Values.dns | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dns
          image: {{ include "mag.image" .Values.dns.image }}
          imagePullPolicy: {{ .Values.dns.image.pullPolicy }}
          args: [-conf, /etc/coredns/Corefile]
          ports:
            - {name: dns-udp, containerPort: 1053, protocol: UDP}
            - {name: dns-tcp, containerPort: 1053, protocol: TCP}
            - {name: health, containerPort: 8080, protocol: TCP}
            - {name: ready, containerPort: 8181, protocol: TCP}
          livenessProbe:
            httpGet: {path: /health, port: health}
          readinessProbe:
            httpGet: {path: /ready, port: ready}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          resources: {{ toYaml .Values.dns.resources | nindent 12 }}
          volumeMounts:
            - {name: dns-config, mountPath: /etc/coredns, readOnly: true}
      volumes:
        - name: dns-config
          configMap:
            name: {{ include "mag.name" . }}-dns
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mag.name" . }}-dns
  labels: {{ include "mag.labels" . | nindent 4 }}
  {{- with .Values.dns.service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dns.service.type }}
  {{- if eq .Values.dns.service.type "LoadBalancer" }}
  {{- with .Values.dns.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  loadBalancerSourceRanges: {{ toYaml .Values.dns.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dns
  ports:
    - {name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP}
    - {name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP}
{{- end }}
