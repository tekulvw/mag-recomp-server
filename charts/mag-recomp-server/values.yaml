# Chart releases and application image tags are independently versioned.
replicaCount: 1
images:
  medius:
    repository: ghcr.io/tekulvw/mag-recomp-server-medius
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  gameplay:
    repository: ghcr.io/tekulvw/mag-recomp-server-game
    tag: "0.2.0"
    # Optional immutable pin; when nonempty it replaces the image tag.
    digest: ""
    pullPolicy: IfNotPresent
  awsCli:
    repository: public.ecr.aws/aws-cli/aws-cli
    tag: "2.31.15"
    pullPolicy: IfNotPresent
  python:
    repository: python
    tag: "3.13.7-slim"
    pullPolicy: IfNotPresent
imagePullSecrets: []
nodeSelector:
  kubernetes.io/arch: amd64
tolerations: []
affinity: {}
network:
  # Required: address clients can reach, also provisioned/routed by your LB controller.
  advertisedIPv4: ""
  authDns: ""
  # Match the original client MAPS endpoint port when using a DNS-only redirect.
  mapsPort: 10073
  annotations: {}
  externalTrafficPolicy: Cluster
  # UDP game ports on the Medius Service and Pod. The integrated DME gives each connected human
  # the next free UDP port from 10474 upward, across every world. Medius admits at most one human
  # per port in this range (MAG_DME_UDP_PORT_END); the rest wait in the queue until a port frees.
  udpPortRange:
    start: 10474
    end: 10474
  # Optional lower cap on concurrent DME humans across all worlds (MAG_DME_HUMAN_CAPACITY),
  # at most the size of udpPortRange. Null uses the range size.
  dmeHumanCapacity: null
runtime:
  # Existing Secret with medius-keys.json; never put RSA material in Helm values.
  existingSecret: ""
  # Bump on external Secret rotation to roll Pods.
  revision: "1"
  # Retail Suppression. Select 20230 plus matching files/protocol for legacy clients.
  applicationId: 20231
  protocolVersion: 1740
  gameType: 3
  minimumPlayers: 1
  maximumPlayers: 8
  # Optional first spawn-wave delay override in ms (1-120000): one value for both
  # teams or [team0, team1]. Unset keeps the spawn catalog's authored delay.
  initialSpawnDelayMs: null
  # Optional level for newly created characters (MAG_STARTING_LEVEL). They start
  # as if they had earned it: the level's XP threshold and the skill points of
  # every gained level. Unset keeps the progression catalog's StartingLevel.
  startingLevel: null
  # Optional minimum level reached on completing Training (MAG_TRAINING_LEVEL).
  # After the Training XP bonus, a character below this level is raised to it as
  # if earned (the level's XP threshold and every gained level's skill points);
  # one at or above it keeps the bonus alone. Only new completions are affected,
  # not characters that completed Training earlier. Requires the progression and
  # Training-completion catalogs. Unset keeps the Training XP bonus alone.
  trainingLevel: null
  # Optional hours (1-720) an open match reward row may go without a reward
  # before compaction may evict it (MAG_REWARD_LEDGER_OPEN_MATCH_TTL_HOURS).
  # Unset keeps Medius's 24 hour default.
  rewardLedgerOpenMatchTtlHours: null
accounts:
  existingClaim: ""
  size: 1Gi
  # Empty uses the cluster default. Private homelabs should use their block CSI class.
  storageClass: ""
  accessModes: [ReadWriteOnce]
data:
  mode: existingClaim
  # Must contain the files below at its root. Needs RWX when Pods use different nodes.
  existingClaim: mag-runtime-data
  revision: "1"
  emptyDirSizeLimit: 8Gi
  s3:
    endpoint: ""
    region: us-east-1
    bucket: ""
    key: ""
    versionId: ""
    sha256: ""
    existingSecret: ""
    forcePathStyle: true
  files:
    items: retail-items.json
    spawns: retail-sver-sup-spawns.json
    wireProfiles: wire-profiles.json
    # Optional operator identities; empty keeps the synthetic public defaults.
    botNames: ""
    # Raw owned-skill modifiers consumed by gameplay, not the purchase projection.
    skills: retail-skills.json
    characterBlastRules: character-blast-rules.json
    bootstrapLoadouts: retail-all-factions-bootstrap-loadouts.json
    retailCombatMetadata: retail-combat.json
    fallDamageRules: retail-falling-damage.json
    # These two paths are used only by explicit legacy application 20230.
    loadoutDefaults: loadout-defaults.json
    developmentProgression: development-progression.json
    # Optional profile-qualified progression inputs for either application; empty omits env.
    trainingCompletion: ""
    progression: ""
    # Medius purchase tiers/costs; distinct from gameplay files.skills above.
    retailSkills: retail-skill-purchases.json
    retailArmory: retail-armory.json
  # Optional gameplay flags, e.g. collision inputs. Chart-managed flags cannot be overridden.
  # Retail structure/bunker inputs are unsupported and rejected. Use /data/<path>.
  gameplayExtraArgs: []
# Optional configured world registry (docs/configured-world-registry.md): 2-16 gameplay workers,
# each with its own Deployment, ClusterIP Service (bridge 31000), data bundle and --worker-id,
# placed by one Medius. Empty keeps the single gameplay Deployment. Needs retail 20231 and
# application images that support --worker-id, --match-profiles and registry client_address
# "$MAG_ADVERTISE_IPV4". See the chart README, "Configured gameplay workers".
gameplayWorkers: []
#  - id: sabotage                # --worker-id and, unless name is set, the resource suffix
#    name: ""                    # optional resource suffix: <release>-mag-recomp-server-gameplay-<name>
#    matchProfiles: sabotage/match-profiles.json   # --match-profiles /data/<path>
#    data:
#      revision: "1"
#      # Only key and sha256 are required; endpoint, region, bucket, existingSecret and
#      # forcePathStyle default to data.s3. versionId never inherits.
#      s3: {key: workers/sabotage.tar.gz, sha256: <64 hex>}
#      files: {}                 # overrides of data.files for this worker's bundle
#    emptyDirSizeLimit: 8Gi      # default data.emptyDirSizeLimit
#    navigation:                 # optional second bundle, unpacked read-only at mountPath
#      s3: {key: navigation/sabotage.tar.gz, sha256: <64 hex>}
#      revision: "1"
#      emptyDirSizeLimit: 4Gi
#      mountPath: /navigation
#    extraArgs: []               # worker gameplay flags; data.gameplayExtraArgs is not used
#    minimumPlayers: 2           # registry minimum_players
#    maximumPlayers: 8           # registry maximum_players, default runtime.maximumPlayers: the largest
#                                # world this worker may form (up to 256). Up to 64 it is also the human
#                                # limit. Above 64 (128 Acquisition, 256 Domination profiles) humans stay
#                                # within each profile's caps, 32 per world and 16 per side, and the DME
#                                # port budget.
#    minimumPlayersPerTeam: [1, 1]
#    draining: false             # reloaded live without restarting Medius
#    resources: {}               # default resources.gameplay
#    nodeSelector: {}            # each scheduling key defaults to the top-level value
#    tolerations: []
#    affinity: {}
worldRegistry:
  # Optional private-party invite window (1-300 s); null leaves party matchmaking off. Workers
  # also need --party-reservations in extraArgs.
  partyInviteSeconds: null
  # The Medius Pod waits up to this long for every worker Service before starting, so every world
  # opens together. A worker it could not reach is started later by restart adoption. 0 skips the wait.
  workerWaitSeconds: 300
  # Restart adoption (docs/configured-world-registry.md): {enabled, maxAdoptions, windowSeconds}.
  # Empty keeps Medius's defaults: on, at most 3 adoptions per world in 600 s.
  workerRestartAdoption: {}
resources:
  gameplay:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 2Gi}
  medius:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  maps:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  init:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 1Gi}
# Optional portal game-ticket sign-in for Medius (docs/portal-ticket.md). "off" keeps the
# development name sign-in and sets no environment. "required" accepts only valid portal
# tickets and needs the audience and at least one key.
portalTickets:
  mode: "off"
  # This server's host name, exactly as the portal writes it into tickets.
  audience: ""
  # Key ID (0-255) to base64 DER SubjectPublicKeyInfo, as served by the portal's
  # GET /api/v1/ticket-keys. Public keys, not secrets. Keep the old key while rotating.
  keys: {}
# Optional internal admin API for character maintenance (docs/admin-cli.md, "Admin API"),
# served by the main medius container only. It is cluster-internal: a ClusterIP Service and a
# NetworkPolicy admit only pods in allowedNamespaceSelector namespaces. Never route it through a
# Gateway, Ingress or LoadBalancer.
characterStore:
  # Where Medius keeps characters, reward receipts and match progress (MAG_CHARACTER_STORE):
  # json is the /accounts/characters.json file; postgres is a PostgreSQL database such as a
  # CloudNativePG cluster. json renders nothing new.
  backend: json
  postgres:
    # Required with postgres: an existing Secret with host, port, dbname, user and password
    # (a CloudNativePG <cluster>-app Secret). Mounted read-only in main Medius and MAPS.
    existingSecret: ""
    # Optional Secret with the server CA as ca.crt (a CloudNativePG <cluster>-ca Secret); only
    # ca.crt is mounted, and the server certificate is then verified. Empty requires TLS unverified.
    caSecret: ""
    # Optional days (1-90) settled reward receipts and match rows are kept
    # (MAG_REWARD_LEDGER_RETENTION_DAYS). Unset keeps Medius's 7 days.
    ledgerRetentionDays: null
adminApi:
  enabled: false
  port: 10490
  # Existing Secret with the shared HMAC secret (at least 32 bytes) under secretKey; the
  # calling portal must use the same value. Never put the secret in Helm values.
  existingSecret: ""
  secretKey: admin-api-secret
  # Required when enabled: namespaces whose pods may call the API, for example
  # {matchLabels: {kubernetes.io/metadata.name: mag-portal}}.
  allowedNamespaceSelector: {}
# Shutdown of every gameplay Pod (docs/worker-shutdown.md; gameplay images with --drain-seconds).
# On SIGTERM a worker admits no one, tells Medius, waits up to drainSeconds for its humans to
# leave (the match ends and results are delivered), then up to receiptFlushSeconds for Medius to
# acknowledge rewards already reported, and exits. Any players still in its match then return to
# the menu. null keeps the image defaults (0 and 5 s) and the Kubernetes 30 s grace period; a set
# value also sets terminationGracePeriodSeconds to drainSeconds + receiptFlushSeconds + 15.
gameplayShutdown:
  drainSeconds: null
  receiptFlushSeconds: null
logs:
  sizeLimit: 2Gi
  # Optional gameplay event-log and tick-telemetry rotation (gameplay images that
  # support --log-segment-bytes). Without it a full 64 MiB log stops gameplay.
  # Retention bounds disk use by age only; keep segment rate x retention well
  # below sizeLimit.
  rotation:
    segmentBytes: null
    retentionSeconds: null

# Optional targeted forwarding resolver. No original hostnames are guessed.
dns:
  enabled: false
  image:
    repository: registry.k8s.io/coredns/coredns
    tag: "v1.12.4"
    pullPolicy: IfNotPresent
  answerIPv4: ""
  hostnames: []
  # /etc/resolv.conf uses the cluster resolver. Never point it back to this service.
  upstreams: [/etc/resolv.conf]
  service:
    type: LoadBalancer
    loadBalancerIP: ""
    annotations: {}
    # Required when DNS is enabled with a LoadBalancer; limit to your LAN/VPN.
    loadBalancerSourceRanges: []
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {memory: 128Mi}
